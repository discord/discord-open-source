on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: npm
    - run: npm ci
    - run: npm test
    - name: Validate live Discord invites
      if: github.event_name == 'schedule'
      run: npm run validate-online
