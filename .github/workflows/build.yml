name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q IosStyleLauncher.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
        working-directory: IosStyleLauncher
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: IosStyleLauncher/app/build/outputs/apk/debug/app-debug.apk
